version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: glamgo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glamgo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glamgo_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-glamgo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glamgo_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glamgo_admin} -d ${POSTGRES_DB:-glamgo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: glamgo_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - glamgo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  glamgo_pgdata:
    name: glamgo_pgdata
  glamgo_redisdata:
    name: glamgo_redisdata
