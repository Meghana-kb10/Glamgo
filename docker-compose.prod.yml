version: '3.8'

services:
  glamgo_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glamgo_production_app
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-glamgo_admin}:${POSTGRES_PASSWORD:-glamgo_secret_pass}@postgres:5432/${POSTGRES_DB:-glamgo_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-glamgo_production_secret_key_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - glamgo_network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: glamgo_production_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glamgo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glamgo_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-glamgo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glamgo_prod_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glamgo_admin} -d ${POSTGRES_DB:-glamgo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glamgo_network

  redis:
    image: redis:7-alpine
    container_name: glamgo_production_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - glamgo_prod_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - glamgo_network

networks:
  glamgo_network:
    name: glamgo_network
    driver: bridge

volumes:
  glamgo_prod_pgdata:
    name: glamgo_prod_pgdata
  glamgo_prod_redisdata:
    name: glamgo_prod_redisdata
