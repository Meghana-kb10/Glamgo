services:
  # 1. Full-Stack Web Service (API + Vite SPA)
  - type: web
    name: glamgo-web
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glamgo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: glamgo-redis
          property: connectionString

  # 2. Redis Cache & Concurrency Lock Instance
  - type: redis
    name: glamgo-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: glamgo-postgres
    plan: starter
    region: oregon
    databaseName: glamgo_db
    user: glamgo_admin
